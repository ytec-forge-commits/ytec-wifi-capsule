name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - AnyCPU
          - x86
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.302

      - name: Restore
        shell: pwsh
        run: >
          dotnet restore .\YtecWifiCapsule.slnx
          -p:PlatformTarget=${{ matrix.platform }}
          -p:Prefer32Bit=false

      - name: Build
        shell: pwsh
        run: >
          dotnet build .\YtecWifiCapsule.slnx
          -t:Rebuild
          -c Release
          --no-restore
          -p:PlatformTarget=${{ matrix.platform }}
          -p:Prefer32Bit=false

      - name: Run regression tests
        shell: pwsh
        run: >
          & .\tests\Ytec.WifiCapsule.Tests\bin\Release\net461\Ytec.WifiCapsule.Tests.exe

      - name: Verify Japanese and English resources
        if: matrix.platform == 'AnyCPU'
        shell: powershell
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\eng\Test-Localization.ps1

  public-source-policy:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public-source boundary
        shell: powershell
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\eng\Test-PublicSource.ps1
